name: Tests et Docker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tests JavaScript
        run: npm test
      - name: Valider Docker Compose
        run: docker compose config --quiet
      - name: Construire et démarrer avec le script d'installation
        run: sh ./install.sh
      - name: Vérifier le serveur et le logo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:8888/healthz
          curl --fail --silent --show-error http://localhost:8888/ -o /tmp/served-index.html
          cmp index.html /tmp/served-index.html
          curl --fail --silent --show-error http://localhost:8888/assets/logo.png -o /tmp/served-logo.png
          cmp assets/logo.png /tmp/served-logo.png
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:8888/.env)" = 404
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:8888/README.md)" = 404
      - name: État et journaux
        if: always()
        run: docker compose ps && docker compose logs --no-color
      - name: Arrêter le conteneur
        if: always()
        run: docker compose down
